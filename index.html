<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabat Attendance Tracker</title>
  <!-- CDN Tailwind CSS untuk Tampilan Modern & Responsif -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

  <div class="max-w-3xl mx-auto p-4 sm:p-6 space-y-6">
    
    <!-- Header -->
    <header class="bg-blue-600 text-white p-5 rounded-xl shadow-md text-center">
      <h1 class="text-2xl font-bold">Sabat Attendance Tracker</h1>
      <p class="text-sm text-blue-100 mt-1">Pencatatan & Laporan Absensi Realtime</p>
    </header>

    <!-- Form Input Absensi -->
    <section class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
      <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">Form Input Absen</h2>
      
      <form id="attendanceForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
          <input type="text" id="nama" required placeholder="Masukkan nama..." 
                 class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Status Kehadiran</label>
          <select id="status" class="w-full p-2.5 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="Hadir">Hadir</option>
            <option value="Sakit">Sakit</option>
            <option value="Izin">Izin</option>
            <option value="Alpa">Alpa</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal</label>
          <input type="date" id="tanggal" required 
                 class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <button type="submit" id="btnSubmit" 
                class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700 transition">
          Simpan Absensi
        </button>
      </form>
      <div id="formAlert" class="mt-3 text-center text-sm font-medium hidden"></div>
    </section>

    <!-- Section Laporan Bulanan -->
    <section class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5 border-b pb-3">
        <h2 class="text-lg font-semibold text-gray-800">Laporan Bulanan</h2>
        
        <!-- Filter Bulan -->
        <div class="flex items-center gap-2">
          <label for="filterBulan" class="text-sm font-medium text-gray-600">Bulan:</label>
          <input type="month" id="filterBulan" onchange="loadLaporan()" 
                 class="p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <!-- Loading State -->
      <div id="loadingLaporan" class="text-center py-6 text-gray-500 hidden">
        <p>Memuat data laporan...</p>
      </div>

      <!-- Empty State -->
      <div id="emptyLaporan" class="text-center py-6 text-gray-500 hidden bg-gray-50 rounded-lg border border-dashed">
        Tidak ada data absen untuk bulan ini.
      </div>

      <!-- CONTAINER TAMPILAN LAPORAN -->
      <div id="containerLaporan">
        
        <!-- 1. Tampilan Desktop (Tabel) -->
        <div class="hidden md:block overflow-hidden border border-gray-200 rounded-lg">
          <table class="w-full text-left text-sm">
            <thead class="bg-gray-100 text-gray-700 border-b">
              <tr>
                <th class="p-3">Tanggal</th>
                <th class="p-3">Nama</th>
                <th class="p-3">Status</th>
              </tr>
            </thead>
            <tbody id="tableBodyDesktop" class="divide-y divide-gray-200">
              <!-- Rendered via Javascript -->
            </tbody>
          </table>
        </div>

        <!-- 2. Tampilan Mobile (Kartu / Card) -> Mencegah Scroll Horizontal -->
        <div id="cardContainerMobile" class="block md:hidden space-y-3">
          <!-- Rendered via Javascript -->
        </div>

      </div>
    </section>

  </div>

  <script>
    // Set default tanggal hari ini & filter bulan saat pertama load
    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');

      document.getElementById('tanggal').value = `${yyyy}-${mm}-${dd}`;
      document.getElementById('filterBulan').value = `${yyyy}-${mm}`;

      loadLaporan();
    });

    // Handle Submit Form
    function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const alertBox = document.getElementById('formAlert');

      btn.disabled = true;
      btn.innerText = "Layanan menyimpan...";
      alertBox.className = "mt-3 text-center text-sm font-medium hidden";

      const payload = {
        nama: document.getElementById('nama').value,
        status: document.getElementById('status').value, // Mengambil nilai Sakit/Hadir/Izin/Alpa
        tanggal: document.getElementById('tanggal').value
      };

      google.script.run
        .withSuccessHandler((res) => {
          btn.disabled = false;
          btn.innerText = "Simpan Absensi";
          
          if(res.success) {
            alertBox.innerText = res.message;
            alertBox.className = "mt-3 text-center text-sm font-medium text-green-600 block";
            document.getElementById('nama').value = '';
            
            // Refresh Laporan
            loadLaporan();
          } else {
            alertBox.innerText = "Gagal: " + res.message;
            alertBox.className = "mt-3 text-center text-sm font-medium text-red-600 block";
          }
        })
        .withFailureHandler((err) => {
          btn.disabled = false;
          btn.innerText = "Simpan Absensi";
          alertBox.innerText = "Error: " + err.message;
          alertBox.className = "mt-3 text-center text-sm font-medium text-red-600 block";
        })
        .simpanAbsen(payload);
    }

    // Load Data Laporan Bulanan
    function loadLaporan() {
      const bulan = document.getElementById('filterBulan').value;
      const loading = document.getElementById('loadingLaporan');
      const empty = document.getElementById('emptyLaporan');
      const container = document.getElementById('containerLaporan');
      const tableBody = document.getElementById('tableBodyDesktop');
      const cardContainer = document.getElementById('cardContainerMobile');

      loading.classList.remove('hidden');
      empty.classList.add('hidden');
      container.classList.add('hidden');

      google.script.run
        .withSuccessHandler((data) => {
          loading.classList.add('hidden');

          if (!data || data.length === 0) {
            empty.classList.remove('hidden');
            return;
          }

          container.classList.remove('hidden');
          tableBody.innerHTML = '';
          cardContainer.innerHTML = '';

          data.forEach((item) => {
            const badgeStyle = getBadgeStyle(item.status);

            // Render Row Desktop
            const tr = document.createElement('tr');
            tr.className = "hover:bg-gray-50";
            tr.innerHTML = `
              <td class="p-3 text-gray-600">${item.tanggal}</td>
              <td class="p-3 font-medium text-gray-900">${item.nama}</td>
              <td class="p-3">
                <span class="px-2.5 py-1 text-xs font-semibold rounded-full border ${badgeStyle}">
                  ${item.status}
                </span>
              </td>
            `;
            tableBody.appendChild(tr);

            // Render Card Mobile
            const card = document.createElement('div');
            card.className = "p-4 bg-white border border-gray-200 rounded-lg shadow-sm flex items-center justify-between";
            card.innerHTML = `
              <div>
                <div class="font-semibold text-gray-900">${item.nama}</div>
                <div class="text-xs text-gray-500 mt-1">Tanggal: ${item.tanggal}</div>
              </div>
              <div>
                <span class="px-2.5 py-1 text-xs font-semibold rounded-full border ${badgeStyle}">
                  ${item.status}
                </span>
              </div>
            `;
            cardContainer.appendChild(card);
          });
        })
        .withFailureHandler((err) => {
          loading.classList.add('hidden');
          alert("Gagal memuat laporan: " + err.message);
        })
        .getLaporanBulanan(bulan);
    }

    // Generator Style Badge Status UI
    function getBadgeStyle(status) {
      switch (status) {
        case 'Sakit':
          return 'bg-amber-100 text-amber-800 border-amber-300';
        case 'Izin':
          return 'bg-blue-100 text-blue-800 border-blue-300';
        case 'Alpa':
          return 'bg-red-100 text-red-800 border-red-300';
        default: // Hadir
          return 'bg-green-100 text-green-800 border-green-300';
      }
    }
  </script>
</body>
</html>
